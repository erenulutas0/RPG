<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Çıkış Unity</title><style>body{background:#111724;color:#e9eee8;font:16px/1.6 system-ui;margin:24px}main{max-width:1050px;margin:auto}p{color:#b3bfcd}.row{display:flex;gap:14px;flex-wrap:wrap}button{font:inherit;padding:12px;background:#2a4241;color:#e4f6ec;border:1px solid #8ba394;cursor:pointer}img{width:390px;max-width:100%;margin-top:20px}a{color:#a9e2cf}</style><main><h1>Final çıkışı · Unity görüntüleri</h1><p>Mühür oyunun gerçek konumunu ve bekleme süresini izliyor. Bu görüntüler test katından alınmış gerçek Unity renderlarıdır; telefon kaydı değildir.</p><div class="row"><button data-file="exit-idle">Çıkış alanı</button><button data-file="exit-hold">Bekleme ilerlemesi</button><button data-file="exit-paused">Duraklama</button><button data-file="exit-direction">Ekran dışı yön</button></div><img id="shot" src="exit-idle.png" alt="Final çıkışı"><p>Ekran dışı kontrolünde kamera bilerek arenadan uzağa taşındı. Çıkışın gerçek konumu değişmedi.</p><a href="README.md">Doğrulama notları</a></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('#shot').src=b.dataset.file+'.png';document.querySelector('#shot').alt=b.textContent})</script></html>
