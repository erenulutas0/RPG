<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Bazalt zemin</title><style>body{background:#11131e;color:#e4ded1;font:16px system-ui;margin:0;padding:26px}main{max-width:1200px;margin:auto}h1,a{color:#dfb573}select,button{background:#282532;color:#eee;border:1px solid #71604b;padding:12px;font:inherit;border-radius:6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%}p{line-height:1.6}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>Dökümhane · Bazalt yüzey</h1><p>Çapraz yüzey çizgilerinden daha doğal taş aşınmasına. Taş yerleşimi ve yollar aynı.</p><select id="view"><option value="point-0">Avlu</option><option value="point-1">Fırın çukuru</option><option value="point-4">Kapı yaklaşımı</option><option value="bridge-detail">Köprü</option><option value="start">Oyun kamerası</option><option value="overview">Haritanın bütünü</option></select><div class="pair"><section><h2>Önce · V3</h2><img id="before" src="before/point-0.png"></section><section><h2>Sonra · V4</h2><img id="after" src="after/point-0.png"></section></div><p>Aynı Unity kamera konumları. Hareketli nesneler farklı pozlarda olabilir.</p><a href="README.md">Doğrulama ve sınırlar</a> · <a href="prompt.txt">Üretim promptu</a></main><script>document.getElementById('view').onchange=e=>{for(const side of ['before','after'])document.getElementById(side).src=side+'/'+e.target.value+'.png'}</script></html>
