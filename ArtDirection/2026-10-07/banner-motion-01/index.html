<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Köprü sancakları</title><style>body{background:#11131e;color:#e4ded1;font:16px system-ui;margin:0;padding:28px}main{max-width:960px;margin:auto}h1,a{color:#dfb573}button{background:#282532;color:#eee;border:1px solid #71604b;padding:12px;font:inherit;border-radius:6px}img{width:100%;margin-top:16px}p{line-height:1.6}</style><main><h1>Köprü · Kumaş hareketi</h1><p>Üst bağlantı sabit; kumaş alt uçlara doğru yavaşça dalgalanıyor. Hareket, oyunun duraklatılmasıyla birlikte duruyor.</p><button id="play">Oynat</button> <button id="rest">Sabit duruş</button><p>Gerçek Unity çekimlerinden sekiz karelik kısa tekrar. Canlı oyun veya kesintisiz video değildir.</p><img id="frame" src="rest.png" alt="Köprü girişindeki sancaklar"><p><a href="device-bridge.png">Telefon görünümü</a> · <a href="device-motion.png">İkinci poz</a> · <a href="README.md">Doğrulama notları</a></p></main><script>let playing=false,index=0;const frame=document.getElementById('frame'),play=document.getElementById('play');play.onclick=()=>{playing=!playing;play.textContent=playing?'Durdur':'Oynat'};document.getElementById('rest').onclick=()=>{playing=false;play.textContent='Oynat';frame.src='rest.png'};setInterval(()=>{if(playing&&!document.hidden){frame.src='frame-'+index+'.png';index=(index+1)%8}},200)</script></html>
