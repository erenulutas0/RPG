<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Kapı ve baca silüeti</title>
<style>body{margin:0;background:#11131c;color:#eee8df;font:17px/1.6 system-ui}main{max-width:1400px;margin:auto;padding:28px}p{color:#c2bac8}img{width:100%;display:block}a{color:#e4b477}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}button{font:inherit;padding:10px 18px;background:#2d3041;color:white;border:1px solid #8c795b;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#71532c}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style>
<main><h1>Kapı ve baca silüeti</h1><p>Kapı kulelerinde bronz kuşaklı metal tepelikler, dört fırının bacalarında çatıya oturan destekler. Gerçek Unity görüntüleri; önce ve sonra aynı inceleme açılarını kullanır.</p>
<button aria-pressed="false" onclick="show(false)">Önce</button> <button aria-pressed="true" onclick="show(true)">Sonra</button>
<div class="pair"><section><h2>Kapı</h2><a id="gate-link" href="gate-detail.png"><img id="gate" src="gate-detail.png" alt="Kapı kulesi tepelikleri"></a></section><section><h2>Fırın</h2><a id="furnace-link" href="furnace-detail.png"><img id="furnace" src="furnace-detail.png" alt="Baca destekleri"></a></section></div>
<h2>Haritanın tamamı</h2><a id="map-link" href="after.png"><img id="map" src="after.png" alt="Güncel Unity haritası"></a><p><a href="README.md">Üretim ve doğrulama kaydı</a></p></main>
<script>function show(after){const files={gate:after?'gate-detail.png':'before-gate.png',furnace:after?'furnace-detail.png':'before-furnace.png',map:after?'after.png':'before.png'};Object.entries(files).forEach(([id,file])=>{document.getElementById(id).src=file;document.getElementById(id+'-link').href=file});document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(after?1:0))));}</script></html>
