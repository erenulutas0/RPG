<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Taşta ışık ve derinlik</title><style>body{background:#11131c;color:#eee8df;font:17px/1.6 system-ui;margin:0}main{max-width:1300px;margin:auto;padding:30px}p{color:#beb7c4}img{display:block;width:100%}a{color:#e6b574}button{padding:12px 24px;margin:10px 8px 18px 0;background:#39291f;color:#ffdab1;border:1px solid #9c7856;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>Taşta ışık ve derinlik</h1><p>Fırın çevresinde ölçülü sıcak yansımalar; platformun altında derinliğe göre koyulaşan taş. Bu tur biçimleri değiştirmeden mevcut mimarinin ışık uyumunu geliştiriyor.</p><button onclick="show('before')">Önce</button><button onclick="show('after')">Yeni çalışma</button><a id="link" href="after.png"><img id="map" src="after.png" alt="Gerçek Unity sahnesinden haritanın bütünü"></a><div class="grid"><section><h2>Fırın çevresi</h2><a href="furnace-detail.png"><img src="furnace-detail.png" alt="Taş kaide üzerindeki sıcak yansıma"></a></section><section><h2>Platformun altı</h2><a href="undercroft-detail.png"><img src="undercroft-detail.png" alt="Derinliğe göre koyulaşan kemer ve ayaklar"></a></section></div><p>Gerçek Unity yakalamaları. <a href="README.md">Üretim ve doğrulama kaydı</a></p></main><script>function show(n){document.getElementById('map').src=n+'.png';document.getElementById('link').href=n+'.png'}</script></html>
