<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryptforge · Yetenek darbesi</title><style>:root{color-scheme:dark;font:16px/1.5 system-ui;background:#10121c;color:#e9e5db}body{max-width:950px;margin:auto;padding:24px}h1{font-size:26px}p{color:#bbc1cd}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;background:#202536;color:inherit;border:1px solid #626579;border-radius:8px;padding:10px 14px}button[aria-pressed=true]{border-color:#e5b15e;background:#3d3024}img{display:block;width:min(100%,540px);margin:auto}a{color:#dfb879}</style><h1>Yetenek darbesi · 01</h1><p>Hasar anında uygulanıyor. Görsel darbe kullanım noktasında genişleyip 0,21 saniyede sönüyor; karakterlerin altında kalıyor. Aşağıdakiler gerçek Unity kareleri, ağır çekim video değil.</p><p>S23 gerçek ekran kaydı · normal hız, 540 piksele küçültülmüş</p><video controls playsinline preload="metadata" style="width:min(100%,360px)" src="device/pulse.mp4"></video><nav></nav><p id="caption"></p><img id="scene" alt="Entegre yetenek halkasının gerçek Unity görüntüsü"><p><a href="README.md">Doğrulama ve cihaz durumu</a></p><script>const states=[['../ability-ring-runtime-01/cooling','Önceki efekt'],['pulse-000','Başlangıç'],['pulse-006','6. kare'],['pulse-012','12. kare'],['pulse-016','16. kare'],['ready-short','Kısa ekran / hazır']];function show(k){document.querySelector('img').src=k+'.png';document.querySelector('#caption').textContent=states.find(s=>s[0]===k)[1];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.key===k))}for(const[k,t]of states){const b=document.createElement('button');b.textContent=t;b.dataset.key=k;b.onclick=()=>show(k);document.querySelector('nav').append(b)}show('pulse-006')</script></html>
